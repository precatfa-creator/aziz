<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Finance Engine</title>
    <style>
      /* Boot loader: lives inside #root so React's first render wipes it.
         Inline on purpose — it must paint before the JS bundle downloads. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .dark #boot { background: #020617; }
      #boot img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
        animation: bootPop 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                   bootBreathe 2.4s 0.6s ease-in-out infinite;
      }
      .dark #boot img { filter: invert(1); }
      #boot .track {
        position: relative;
        width: 11rem;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(100, 116, 139, 0.2);
      }
      #boot .track::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #10b981, #34d399, transparent);
        animation: bootSweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot p {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        color: #94a3b8;
      }
      @keyframes bootPop {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes bootBreathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes bootSweep {
        from { transform: translateX(-120%); }
        to { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot .track::after { animation-duration: 0.01ms; animation-iteration-count: 1; }
      }
    </style>
    <script>
      // Apply the saved theme before first paint. AppContext reads the same key
      // in an effect, which would otherwise flash light mode at dark-mode users.
      if (localStorage.getItem('aziz_theme') === 'dark')
        document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="/logo-mark.png" alt="Aziz" />
        <div class="track"></div>
        <p>AZIZ</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
