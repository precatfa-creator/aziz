<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aziz</title>
    <style>
      /* Boot loader: lives inside #root so React's first render wipes it.
         Inline on purpose — it must paint before the JS bundle downloads.

         Netflix-intro style: the logo is sliced into vertical strips that rise
         and assemble, a light bar sweeps across the finished mark, then the
         progress track loops for as long as loading actually takes. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .dark #boot { background: #020617; }

      #boot .mark {
        position: relative;
        width: 7rem;
        height: 7rem;
      }
      /* Every strip is the whole logo at full size, clipped to its own tenth.
         Identical rendering in each layer means the slices meet exactly — no
         sub-pixel seams — and clip-path is physical, so the RTL page can't
         reverse the order the way a flex row would. */
      #boot .strip {
        position: absolute;
        inset: 0;
        background-image: url(/logo-mark.png);
        background-size: 100% 100%;
        background-repeat: no-repeat;
        transform-origin: 50% 100%;
        animation: bootStrip 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .dark #boot .strip { filter: invert(1); }
      #boot .strip:nth-child(1)  { clip-path: inset(0 90% 0  0%); animation-delay: 0.00s; }
      #boot .strip:nth-child(2)  { clip-path: inset(0 80% 0 10%); animation-delay: 0.05s; }
      #boot .strip:nth-child(3)  { clip-path: inset(0 70% 0 20%); animation-delay: 0.10s; }
      #boot .strip:nth-child(4)  { clip-path: inset(0 60% 0 30%); animation-delay: 0.15s; }
      #boot .strip:nth-child(5)  { clip-path: inset(0 50% 0 40%); animation-delay: 0.20s; }
      #boot .strip:nth-child(6)  { clip-path: inset(0 40% 0 50%); animation-delay: 0.25s; }
      #boot .strip:nth-child(7)  { clip-path: inset(0 30% 0 60%); animation-delay: 0.30s; }
      #boot .strip:nth-child(8)  { clip-path: inset(0 20% 0 70%); animation-delay: 0.35s; }
      #boot .strip:nth-child(9)  { clip-path: inset(0 10% 0 80%); animation-delay: 0.40s; }
      #boot .strip:nth-child(10) { clip-path: inset(0  0% 0 90%); animation-delay: 0.45s; }

      /* Light bar sweeping across the assembled mark, once. */
      #boot .mark::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(16, 185, 129, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-100%);
        animation: bootGleam 1s 0.75s cubic-bezier(0.65, 0, 0.35, 1) both;
      }

      #boot .track {
        position: relative;
        width: 11rem;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(100, 116, 139, 0.2);
        opacity: 0;
        animation: bootFadeIn 0.5s 1.1s ease-out forwards;
      }
      #boot .track::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #10b981, #34d399, transparent);
        animation: bootSweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot p {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        color: #94a3b8;
        opacity: 0;
        animation: bootFadeIn 0.6s 0.95s ease-out forwards;
      }

      @keyframes bootStrip {
        0%   { transform: scaleY(0.04) translateY(18%); opacity: 0; }
        55%  { transform: scaleY(1.08) translateY(0);   opacity: 1; }
        100% { transform: scaleY(1)    translateY(0);   opacity: 1; }
      }
      @keyframes bootGleam {
        to { transform: translateX(100%); }
      }
      @keyframes bootFadeIn {
        to { opacity: 1; }
      }
      @keyframes bootSweep {
        from { transform: translateX(-120%); }
        to   { transform: translateX(360%); }
      }

      /* Assembly is decorative; skip straight to the assembled mark. */
      @media (prefers-reduced-motion: reduce) {
        #boot .strip { animation: none; }
        #boot .mark::after { animation: none; opacity: 0; }
        #boot .track, #boot p { opacity: 1; animation: none; }
        #boot .track::after { animation-duration: 0.01ms; animation-iteration-count: 1; }
      }
    </style>
    <script>
      // Apply the saved theme before first paint. AppContext reads the same key
      // in an effect, which would otherwise flash light mode at dark-mode users.
      if (localStorage.getItem('aziz_theme') === 'dark')
        document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark" role="img" aria-label="Aziz">
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
          <div class="strip"></div>
        </div>
        <div class="track"></div>
        <p>AZIZ</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
